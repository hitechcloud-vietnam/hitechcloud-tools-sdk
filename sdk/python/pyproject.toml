[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hitechcloud-tools-sdk"
version = "1.0.0"
description = "Official Python SDK for HiTechCloud Tools API (455 endpoints)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "HiTechCloud", email = "support@hitechcloud.vn"}]
dependencies = ["requests>=2.28.0"]

[project.urls]
Homepage = "https://doc-api-tools.hitechcloud.vn"
Documentation = "https://doc-api-tools.hitechcloud.vn"
Repository = "https://github.com/hitechcloud-vietnam/hitechcloud-tools-sdk"

[project.optional-dependencies]
dev = ["pytest>=7.0", "responses>=0.23.0"]
