[package]
name = "hitechcloud_tools_sdk"
version = "0.1.0"
edition = "2021"
description = "HiTechCloud hitechcloud-tools-sdk SDK for Rust"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
