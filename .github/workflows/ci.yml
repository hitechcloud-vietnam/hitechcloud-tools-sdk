name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: sdk/python
        run: pip install -e ".[dev]"
      - name: Run tests
        working-directory: sdk/python
        run: pytest tests/ -v

  test-nodejs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: sdk/nodejs
        run: npm install
      - name: Run tests
        working-directory: sdk/nodejs
        run: npm test

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Run tests
        working-directory: sdk/go
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SDK structure
        run: |
          echo "Checking SDK files..."
          for lang in python nodejs php go ruby java csharp; do
            if [ ! -d "sdk/$lang" ]; then
              echo "ERROR: Missing sdk/$lang"
              exit 1
            fi
          done
          echo "All SDK directories present"
